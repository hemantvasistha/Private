<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shalu's Little Universe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&display=swap">
  <style>
  /* Layout: one full-height visual-novel frame. Header (progress), scrolling stage, footer nav. Each stage has its own composition. */
  :root{
    --pink:#FFD6E7; --milk:#F8BBD0; --cream:#FFF7EC; --lav:#E6DDF7; --peach:#FFDCC8; --choc:#6D4C41; --white:#FFFFFF;
    --rose:#E57AA3; --ink:#6D4C41; --paper:#FFFDF8; --night1:#241B4B; --night2:#4A3B83;
    --bg1:#FFF7EC; --bg2:#FFD6E7; --fg:#6D4C41; --soft:rgba(109,76,65,.62);
    --f-ui:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-hand:'Caveat','Segoe Script','Bradley Hand',cursive;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.45;overflow:hidden;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background .8s,color .8s}
  body.night{--bg1:var(--night1);--bg2:var(--night2);--fg:#FFF1F7;--soft:rgba(255,241,247,.75)}
  #app{height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto;position:relative}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
  header{display:flex;align-items:center;gap:10px;padding:10px 0 6px;justify-content:space-between}
  .brand{font-weight:600;letter-spacing:.14em;font-size:.68rem;text-transform:uppercase}
  .brand small{display:block;font-family:var(--f-hand);letter-spacing:0;text-transform:none;font-size:1.05rem;font-weight:500;opacity:.8}
  .count{font-size:.8rem;opacity:.8;font-variant-numeric:tabular-nums}
  .iconbtn{border:0;background:rgba(255,255,255,.65);border-radius:999px;padding:6px 12px;font-size:.8rem;box-shadow:0 2px 8px rgba(109,76,65,.12);color:#6D4C41}
  .dots{display:flex;gap:6px;padding:0 0 6px}
  .dots button{flex:1;height:8px;border:0;border-radius:6px;background:rgba(109,76,65,.16);padding:0;transition:background .3s}
  body.night .dots button{background:rgba(255,255,255,.2)}
  .dots button.done{background:var(--milk)} .dots button.cur{background:var(--rose)}
  .dots button:disabled{cursor:default}
  main{flex:1;min-height:0;position:relative}
  #stage{height:100%;overflow-y:auto;overflow-x:hidden;padding:8px 2px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;animation:inx .5s both}
  #stage.out{animation:outx .22s both}
  @keyframes inx{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes outx{to{opacity:0;transform:translateY(-10px)}}
  footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 10px}
  .chap{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;text-align:center;flex:1;opacity:.8}
  .chap b{display:block;font-family:var(--f-hand);font-size:1.2rem;letter-spacing:0;text-transform:none;font-weight:700}
  .nav{border:0;border-radius:999px;padding:10px 18px;background:var(--white);box-shadow:0 3px 12px rgba(109,76,65,.15);font-weight:500;color:#6D4C41;min-width:92px}
  .nav.primary{background:var(--rose);color:#fff}
  .nav:disabled{opacity:.4;cursor:not-allowed}
  h1,h2,h3,p{margin:0}
  .eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
  .h{font-size:clamp(1.7rem,6.5vw,2.8rem);line-height:1.1;font-weight:600;text-wrap:balance;max-width:20ch}
  .h.wide{max-width:26ch}
  .hand{font-family:var(--f-hand);font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.15;font-weight:700;text-wrap:balance;max-width:24ch}
  .say{min-height:2.6em;font-family:var(--f-hand);font-size:1.7rem;line-height:1.1;font-weight:700;color:var(--rose);max-width:28ch;text-wrap:balance}
  body.night .say{color:#FFC2DD}
  .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .btn{border:0;border-radius:999px;padding:12px 20px;background:var(--white);box-shadow:0 4px 14px rgba(109,76,65,.16);font-weight:500;color:#6D4C41;transition:transform .15s}
  .btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.96)}
  .btn.main{background:var(--rose);color:#fff}
  .btn.lav{background:var(--lav)} .btn.peach{background:var(--peach)}
  .card{background:rgba(255,255,255,.72);backdrop-filter:blur(6px);border-radius:22px;padding:16px 18px;box-shadow:0 6px 22px rgba(109,76,65,.12);color:#6D4C41}
  .tedwrap{display:inline-block}
  .teddy{display:block;overflow:visible;cursor:pointer;animation:bob 3.6s ease-in-out infinite}
  .teddy.bounce{animation:pop .5s}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
  .wave{animation:wave 1.1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px)}}
  @keyframes pop{30%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.96) rotate(3deg)}}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  @keyframes wave{50%{transform:rotate(-18deg)}}
  @keyframes dance{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-10px)}}
  .dance .teddy{animation:dance 1s ease-in-out infinite}
  .fly{position:fixed;pointer-events:none;z-index:50;font-size:1.4rem;color:var(--rose);will-change:transform}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(90vw,420px);z-index:60;background:#fff;color:#6D4C41;padding:14px 18px;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.2);font-family:var(--f-hand);font-size:1.4rem;line-height:1.15;text-align:center}
  /* stage 1 */
  .seal-hint{font-size:.85rem;opacity:.75}
  /* stage 3 */
  .big{font-size:clamp(2rem,10.5vw,4.6rem);font-weight:600;line-height:1;letter-spacing:-.02em;max-width:12ch;background:linear-gradient(90deg,#E57AA3,#B28DEB,#F0A27B,#E57AA3);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite}
  .big span{display:inline-block;animation:letter .6s both}
  @keyframes shim{to{background-position:-250% 0}}
  @keyframes letter{from{opacity:0;transform:translateY(30px) scale(.6)}}
  .party{display:flex;align-items:flex-end;justify-content:center;gap:6px;width:100%;position:relative}
  .cakebtn{background:none;border:0;padding:0;cursor:pointer}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .25s ease-in-out infinite alternate}
  @keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.85,1.12) rotate(3deg)}}
  .out .flame{display:none}
  .smoke{opacity:0}.out .smoke{opacity:.7;animation:smk 1.6s both}
  @keyframes smk{to{transform:translateY(-26px);opacity:0}}
  .balloon{position:absolute;width:44px;height:56px;border-radius:50% 50% 48% 48%;animation:rise 7s ease-in-out infinite;opacity:.9}
  .balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:50px;background:rgba(109,76,65,.35)}
  @keyframes rise{50%{transform:translateY(-22px) rotate(4deg)}}
  /* stage 4,5 */
  .cards{display:grid;gap:10px;width:100%;max-width:520px}
  .roast{display:flex;align-items:center;gap:12px;text-align:left;font-weight:500;animation:inx .5s both}
  .flipgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:560px}
  @media(min-width:560px){.flipgrid{grid-template-columns:repeat(3,1fr)}}
  .flip{perspective:700px;border:0;background:none;padding:0;height:128px}
  .flip>div{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
  .flip.on>div{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;align-items:center;justify-content:center;padding:10px;box-shadow:0 5px 16px rgba(109,76,65,.14)}
  .face.f{background:linear-gradient(145deg,var(--pink),var(--lav));font-size:2rem;color:var(--rose)}
  .face.b{transform:rotateY(180deg);background:var(--paper);font-family:var(--f-hand);font-size:1.18rem;line-height:1.1;font-weight:700;color:#6D4C41}
  /* stage 6 */
  .env{position:relative;width:min(300px,82vw);height:200px;border:0;background:none;padding:0;margin-top:6px}
  .env .body{position:absolute;inset:40px 0 0;background:linear-gradient(160deg,#FFC4DB,#F8A9C8);border-radius:10px 10px 16px 16px;box-shadow:0 10px 26px rgba(229,122,163,.4)}
  .env .v{position:absolute;inset:40px 0 0;background:linear-gradient(135deg,transparent 49.5%,rgba(255,255,255,.35) 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,rgba(255,255,255,.35) 50%) right/50% 100% no-repeat;border-radius:10px;clip-path:polygon(0 100%,50% 40%,100% 100%)}
  .env .flap{position:absolute;left:0;right:0;top:40px;height:96px;background:linear-gradient(180deg,#F59DBF,#FFB7D2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s}
  .env .wax{position:absolute;left:50%;top:112px;transform:translate(-50%,-50%);font-size:2.2rem;color:#C2375F;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));transition:opacity .4s,transform .6s;z-index:2}
  .env.open .flap{transform:rotateX(180deg)} .env.open .wax{opacity:0;transform:translate(-50%,-50%) scale(1.8)}
  .paperwrap{width:100%;max-width:520px;animation:unfold .9s both;transform-origin:top}
  @keyframes unfold{from{opacity:0;transform:scaleY(.1)}to{opacity:1;transform:none}}
  .paper{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 33px,rgba(229,122,163,.18) 33px 34px);color:#5A3F35;border-radius:6px 6px 22px 22px;padding:20px 22px 26px;text-align:left;box-shadow:0 10px 30px rgba(109,76,65,.2);font-family:var(--f-hand);font-size:1.55rem;line-height:34px}
  .paper p{margin-bottom:34px;animation:inx .8s both}
  .paper p.sign{margin:0;text-align:right}
  /* stage 7 */
  .sky{position:relative;width:100%;max-width:520px;border-radius:26px;background:linear-gradient(180deg,#2B2260,#6B58B0 70%,#B79CE0);padding:44px 10px 14px;overflow:hidden;color:#fff}
  .moon{position:absolute;right:18px;top:14px;width:54px;height:54px;border-radius:50%;box-shadow:inset -15px 0 0 0 #FFF3C4;filter:drop-shadow(0 0 12px #FFF3C4)}
  .star{position:absolute;color:#FFF3C4;animation:tw 2.4s ease-in-out infinite;pointer-events:none}
  @keyframes tw{50%{opacity:.25;transform:scale(.7)}}
  .pair{display:flex;justify-content:center;align-items:flex-end;gap:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
  .chip{border:0;border-radius:14px;padding:10px 14px;background:var(--paper);box-shadow:0 4px 12px rgba(109,76,65,.14);font-family:var(--f-hand);font-size:1.25rem;font-weight:700;transform:rotate(var(--r));color:#6D4C41;transition:transform .25s}
  .chip:hover,.chip.hit{transform:rotate(0) scale(1.08);background:var(--pink)}
  .form{width:100%;max-width:520px;display:grid;gap:10px;text-align:left}
  .form label{font-size:.85rem;font-weight:500;display:grid;gap:4px}
  .form textarea{font:inherit;font-family:var(--f-hand);font-size:1.25rem;line-height:1.15;border:2px dashed var(--milk);border-radius:14px;padding:8px 12px;background:var(--paper);color:#6D4C41;resize:vertical;min-height:58px}
  .polas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .pola{background:#fff;padding:8px 8px 22px;box-shadow:0 5px 14px rgba(0,0,0,.2);transform:rotate(var(--r));position:relative;width:128px}
  .pola img{display:block;width:112px;height:112px;object-fit:cover}
  .pola button{position:absolute;right:2px;bottom:1px;border:0;background:none;font-size:.7rem;color:#6D4C41}
  /* stage 8 */
  .confess{min-height:3.4em;display:flex;align-items:center;justify-content:center}
  /* stage 9 */
  .env9grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px;width:100%;max-width:640px}
  @media(min-width:600px){.env9grid{grid-template-columns:repeat(3,1fr)}}
  .e9{border:0;background:none;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0;color:inherit}
  .e9 .bear{margin-bottom:-26px;z-index:1;pointer-events:none}
  .e9 .en{position:relative;width:100%;height:92px;border-radius:8px 8px 14px 14px;background:var(--c);box-shadow:0 6px 16px rgba(109,76,65,.2)}
  .e9 .fl{position:absolute;inset:0 0 auto;height:56px;background:var(--c2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s;z-index:2}
  .e9 .sl{position:absolute;left:50%;top:38px;transform:translateX(-50%);color:#C2375F;z-index:3;transition:opacity .3s}
  .e9.open .fl{transform:rotateX(180deg);z-index:0} .e9.open .sl{opacity:0}
  .e9 .lbl{font-weight:500;font-size:.9rem;margin-top:8px;line-height:1.2}
  .e9 .msg{max-height:0;overflow:hidden;opacity:0;transition:max-height .7s,opacity .7s;font-family:var(--f-hand);font-size:1.35rem;line-height:1.1;font-weight:700;background:var(--paper);border-radius:14px;color:#6D4C41;padding:0 10px}
  .e9.open .msg{max-height:170px;opacity:1;padding:10px;margin-top:8px}
  .e9.open .en{animation:var(--anim) .8s}
  @keyframes shake{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
  @keyframes zoom{40%{transform:scale(1.12)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes jump{40%{transform:translateY(-22px)}}
  @keyframes tilt{50%{transform:rotate(-8deg) scale(1.06)}}
  @keyframes glow{50%{box-shadow:0 0 30px 8px rgba(255,214,231,.95)}}
  .cookie{display:flex;flex-direction:column;align-items:center;gap:8px}
  .secret{border:0;background:none;font-size:1rem;opacity:.45;color:inherit;padding:6px}
  /* stage 10 */
  .night .sky10{position:relative;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
  .lines{min-height:7.2em;display:flex;flex-direction:column;gap:8px;align-items:center}
  .lines p{font-family:var(--f-hand);font-size:clamp(1.4rem,5vw,1.9rem);line-height:1.1;font-weight:700;max-width:26ch;animation:inx 1s both;text-wrap:balance}
  .finalh{font-size:clamp(1.7rem,6.5vw,2.6rem);font-weight:600;line-height:1.1;max-width:18ch;text-wrap:balance;animation:inx 1s both}
  .hugbears{display:flex;justify-content:center;align-items:flex-end;transition:gap .9s;gap:30px}
  .hugbears.hug{gap:0}
  .hugbears.hug .teddy{animation:pop .9s infinite}
  .hugbears.hug>div:first-child{transform:translateX(24px) rotate(6deg);transition:transform .9s}
  .hugbears.hug>div:last-child{transform:translateX(-24px) rotate(-6deg);transition:transform .9s}
  .moonbig{position:absolute;right:4px;top:-4px;width:60px;height:60px;border-radius:50%;box-shadow:inset -17px 0 0 0 #FFF3C4;filter:drop-shadow(0 0 14px #FFF3C4)}
  .glowtext{text-shadow:0 0 18px rgba(255,194,221,.7)}
  /* per-stage worlds so no two screens look alike */
  body.rose{--bg1:#7A2E52;--bg2:#C2557F;--fg:#FFF1F7;--soft:rgba(255,241,247,.8)}
  body.rose .say{color:#FFD6E7} body.rose .card{background:rgba(255,255,255,.16);color:#FFF1F7}
  body[data-s="1"]{--bg1:#E6DDF7;--bg2:#FFF7EC;background:radial-gradient(rgba(183,156,224,.35) 2px,transparent 2.5px) 0 0/24px 24px,linear-gradient(170deg,var(--bg1),var(--bg2))}
  body[data-s="2"]{--bg1:#FFDCC8;--bg2:#F8BBD0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 22px,transparent 22px 44px),linear-gradient(160deg,var(--bg1),var(--bg2))}
  body[data-s="3"]{--bg1:#E6DDF7;--bg2:#FFD6E7;background:linear-gradient(90deg,rgba(255,255,255,.35) 50%,transparent 0) 0 0/36px 36px,linear-gradient(0deg,rgba(255,255,255,.35) 50%,transparent 0) 0 0/36px 36px,linear-gradient(160deg,var(--bg1),var(--bg2))}
  body[data-s="4"]{--bg1:#FFF7EC;--bg2:#E6DDF7;background:radial-gradient(circle at 20% 10%,#FFD6E7 0,transparent 45%),radial-gradient(circle at 90% 80%,#FFDCC8 0,transparent 45%),var(--bg1)}
  body[data-s="5"]{--bg1:#FFF7EC;--bg2:#F3DFC9;background:radial-gradient(ellipse at center,#FFFDF8 30%,#F3DFC9 100%)}
  body[data-s="6"]{--bg1:#FFD6E7;--bg2:#E6DDF7;background:radial-gradient(rgba(255,255,255,.7) 1.5px,transparent 2px) 0 0/18px 18px,linear-gradient(200deg,#FFDCC8,#E6DDF7)}
  body[data-s="7"]{background:radial-gradient(circle at 50% 30%,#D9709A 0,transparent 55%),linear-gradient(180deg,var(--bg1),#4A1D38)}
  body[data-s="8"]{--bg1:#FFDCC8;--bg2:#FFF7EC;background:linear-gradient(90deg,rgba(248,187,208,.35) 50%,transparent 0) 0 0/40px 40px,linear-gradient(0deg,rgba(248,187,208,.35) 50%,transparent 0) 0 0/40px 40px,var(--cream)}
  body[data-s="9"]{background:radial-gradient(circle at 80% 10%,rgba(255,243,196,.25),transparent 40%),linear-gradient(180deg,#1B1440,#4A3B83 80%,#8E6FC0)}
  body[data-s="3"] .h,body[data-s="5"] .h,body[data-s="7"] .h{font-family:var(--f-hand);font-weight:700;font-size:clamp(2.2rem,9vw,3.5rem);line-height:1}
  body[data-s="7"] .hand{font-size:clamp(1.8rem,7vw,2.6rem);max-width:20ch}
  body[data-s="4"] .h{letter-spacing:-.03em;text-transform:uppercase;font-size:clamp(1.5rem,6vw,2.3rem)}
  .roast{position:relative;padding-top:22px;border-radius:6px;transform:rotate(var(--rr,-1.5deg));background:var(--pc,#FFF)}
  .roast::before{content:"";position:absolute;top:-8px;left:50%;width:70px;height:18px;margin-left:-35px;background:rgba(255,255,255,.7);box-shadow:0 1px 3px rgba(0,0,0,.15);transform:rotate(-3deg)}
  .roast:nth-child(5n+1){--pc:#FFF3B8;--rr:-2deg} .roast:nth-child(5n+2){--pc:#FFD6E7;--rr:1.6deg} .roast:nth-child(5n+3){--pc:#E6DDF7;--rr:-1deg} .roast:nth-child(5n+4){--pc:#FFDCC8;--rr:2deg} .roast:nth-child(5n+5){--pc:#D5F0E4;--rr:-1.8deg}
  .bq{display:flex;gap:6px;justify-content:center}
  .fw{width:46px;height:62px;border:0;background:none;position:relative;padding:0}
  .fw::before{content:"";position:absolute;left:50%;bottom:0;width:3px;height:34px;background:#7DB88A;transform:translateX(-50%);border-radius:2px}
  .fw i{position:absolute;left:50%;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle,#FFF1E0 0 32%,var(--c) 34%);box-shadow:0 -11px 0 -3px var(--c),0 11px 0 -3px var(--c),11px 0 0 -3px var(--c),-11px 0 0 -3px var(--c);transform:scale(.7);transition:transform .5s}
  .fw.bloom i{transform:scale(1.25) rotate(45deg)}
  .gift{position:relative;width:116px;height:104px;border:0;background:none;display:block;margin:6px auto;padding:0;animation:shake 2.2s infinite}
  .gift .box{position:absolute;inset:36px 6px 0;background:#E6DDF7;border-radius:6px;box-shadow:0 8px 16px rgba(109,76,65,.22)}
  .gift .rib{position:absolute;left:50%;top:36px;bottom:0;width:16px;margin-left:-8px;background:#F06292}
  .gift .lid{position:absolute;left:0;right:0;top:14px;height:26px;background:#F8BBD0;border-radius:6px;z-index:2;transition:transform .8s,opacity .8s;box-shadow:0 3px 8px rgba(109,76,65,.2)}
  .gift .lid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:16px;margin-left:-8px;background:#F06292}
  .gift .lid::after{content:"✿";position:absolute;left:50%;top:-20px;transform:translateX(-50%);font-size:28px;color:#F06292}
  .gift.open{animation:none} .gift.open .lid{transform:translate(46px,-70px) rotate(28deg);opacity:0}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div id="app">
